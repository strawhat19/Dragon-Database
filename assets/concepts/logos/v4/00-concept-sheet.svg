<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1536" role="img" aria-labelledby="v4-sheet-title v4-sheet-description">
<title id="v4-sheet-title">Dragon Database Nightmaw Logo Concepts</title>

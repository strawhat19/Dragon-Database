  style="color: #171719"
>
  <title id="dr-serpent-rune-title">Dragon Database — DR Serpent Rune</title>
  <desc id="dr-serpent-rune-description">
    Custom silver D and R initials sit within the sweep of a black dragon.
    A long reptilian snout, backward horns, an angry crimson eye, exposed fangs,
    and one angular batwing give the dragon a fierce profile. Its tail sweeps
    beneath the initials. The editable Dragon Database wordmark is set in serif
    type to the right on a transparent canvas.
  </desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="376 36 548 310" role="img" aria-labelledby="medieval-wordmark-title medieval-wordmark-description">
<title id="medieval-wordmark-title">Dragon Database — Medieval Fantasy Wordmark</title>

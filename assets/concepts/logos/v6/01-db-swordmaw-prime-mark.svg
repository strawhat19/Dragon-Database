  <title id="db-swordmaw-prime-title">Dragon Database — DB Swordmaw Prime Mark</title>
  <desc id="db-swordmaw-prime-description">A refined black DB ligature carries a snarling dragon in right-facing profile, with a broader armored jaw, sharply swept horns, a silver angry eye, and a black bat wing with silver membrane facets. Two slim silver medieval swords cross behind the letters. Roomier D and B counters remain transparent through the swords.</desc>

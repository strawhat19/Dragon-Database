         L 103 97
         L 98 68
         L 126 88
         L 161 87
         L 143 102
         L 162 116
         L 133 124
         L 124 143
         L 124 231
         C 142 245 164 251 188 248
         C 231 244 256 219 256 180
         C 256 141 231 119 191 116
         L 177 84
         C 246 82 294 120 294 180
         C 294 245 250 282 187 283
         C 145 284 111 271 84 253
         L 84 148
         L 68 138
         Z
         M 105 112
         L 119 108
         L 114 118
         Z"
    />
    <path
      id="coiled-d-sea-glass-tail"
      fill="#39BAAE"

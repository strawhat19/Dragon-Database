  <title id="db-swordmaw-crowned-mark-title">Dragon Database — DB Swordmaw Crowned Mark</title>
  <desc id="db-swordmaw-crowned-mark-description">The selected Swordmaw Prime dragon, wing, DB letters, and facial details remain unchanged. Crossed swords retain Prime blade thickness and gain curved ceremonial guards, silver grip bands, modest diamond guard ends, faceted diamond pommels, and slightly taller tips. Black and silver editable paths surround transparent letter counters and a transparent canvas.</desc>

>
  <title id="obsidian-codex-title">Dragon Database — Obsidian Codex</title>
  <desc id="obsidian-codex-description">
    A black dragon with broad swept wings guards an open book. Its front-facing
    horned head, spacious transparent page folds, and strong central spine form
    a compact library emblem. A crimson bookmark falls from the book, paired
    with an editable serif Dragon Database wordmark on a transparent canvas.
  </desc>

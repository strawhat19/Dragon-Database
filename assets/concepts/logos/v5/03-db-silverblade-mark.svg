  <title id="db-silverblade-title">Dragon Database — DB Silverblade</title>
  <desc id="db-silverblade-description">
    An original tall silver DB ligature shares the upright blade of a medieval
    broadsword. Its diamond pommel, wrapped grip, flared crossguard, and pointed
    blade remain visible around the letters. A threatening black dragon rises
    from the B with long swept horns, an angry silver eye, and an exposed fang.
    Black flames climb behind the left side. All lettering and artwork use
    editable paths on a transparent canvas, in black and two shades of silver.
  </desc>

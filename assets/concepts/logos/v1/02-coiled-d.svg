  role="img"
  width="960"
  height="360"
  viewBox="0 0 960 360"
  xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="coiled-d-title coiled-d-description"
  style="color: #102D35"
>
  <title id="coiled-d-title">Dragon Database — Coiled D</title>
  <desc id="coiled-d-description">
    A sleek dragon coils into a bold capital D. Its angular head has one horn
    and a transparent eye; a sea-glass tail closes the curve. The editable
    Dragon Database wordmark sits to the right on a transparent canvas.
  </desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1410" role="img" aria-labelledby="concept-sheet-title concept-sheet-description">
<title id="concept-sheet-title">Dragon Database Logo Concepts</title>
<desc id="concept-sheet-description">Four original editable logo directions: Ember Index, Coiled D, Winged Archive, and Scale Vault. Each card shows the actual vector lockup, its idea, and its proposed palette.</desc>
<rect id="concept-sheet-background" width="1760" height="1410" fill="#F4F1EB"/>
<g id="concept-sheet-heading" fill="#252C30" font-family="Avenir Next, Avenir, Helvetica, Arial, sans-serif">
<text x="80" y="105" font-size="56" font-weight="650" letter-spacing="-1.8">Dragon Database</text>
<text x="82" y="154" font-size="22" fill="#6D706F">Four original logo directions</text>
<text x="1678" y="101" font-size="17" text-anchor="end" letter-spacing="2">LOGO CONCEPTS / V1</text>
<text x="1678" y="139" font-size="17" text-anchor="end" fill="#6D706F">October 2026</text>
</g>

  <title id="db-ironfang-title">Dragon Database — DB Ironfang</title>
  <desc id="db-ironfang-description">A threatening frontal dragon with long swept horns, armored angular cheeks, a snarling reptilian muzzle, crimson angry eyes, and swept silver wings. Original black D and B letter paths form the broad base of its neck. An editable scholarly Dragon Database wordmark sits beside the mark.</desc>

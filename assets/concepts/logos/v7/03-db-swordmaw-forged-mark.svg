  <title id="db-swordmaw-forged-title">Dragon Database — DB Swordmaw Forged Mark</title>
  <desc id="db-swordmaw-forged-description">The original Swordmaw Prime dragon, wing, DB letters, and facial details pair with two ceremonial forged swords. The swords retain the Prime blade width, angle, pointed tips, and black edge weight, adding broad silver blade facets, sturdy curved guard shoulders, compact black grips, and faceted pommels. The Prime letter counters remain transparent through the swords.</desc>

<title id="db-blackflame-title">Dragon Database — DB Blackflame</title>
<desc id="db-blackflame-description">A silver-and-black dragon DB emblem with flames or medieval sword details, paired with original black path lettering spelling Dragon Database on a silver background. The lettering has uneven fantasy proportions, pointed medieval terminals, and a sword underline.</desc>

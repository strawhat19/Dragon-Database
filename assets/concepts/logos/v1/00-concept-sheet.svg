<svg x="924" y="874" width="730" height="274" viewBox="0 0 960 360" style="color:#332A4E">
  <title id="scale-vault-title">Dragon Database — Scale Vault</title>
  <desc id="scale-vault-description">Three nested dragon scales form a tapered collection seal, pairing layered records with the idea of a dragon guarding its hoard. Plum, lilac, and a serif wordmark create a quiet archival identity.</desc>

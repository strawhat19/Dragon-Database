  width="960"
  height="360"
  viewBox="0 0 960 360"
  id="db-silvermaw-logo"
  xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="db-silvermaw-title db-silvermaw-description"
  style="color: #141418"
>
  <title id="db-silvermaw-title">Dragon Database — DB Silvermaw</title>
  <desc id="db-silvermaw-description">
    A tall custom silver DB ligature has open angular counters and a shared
    upright frame. A threatening black dragon rises from the B, with long swept
    crown horns, an extended right-facing snout, a slanted red eye, and a silver
    fang. A narrow crimson batwing climbs behind the letters. The exact Dragon
    Database wordmark remains editable on the transparent canvas.
  </desc>

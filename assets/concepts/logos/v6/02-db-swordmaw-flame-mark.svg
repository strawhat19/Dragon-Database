  <title id="db-swordmaw-flame-title">Dragon Database — DB Swordmaw Flame</title>
  <desc id="db-swordmaw-flame-description">
    A custom black DB ligature rises into a threatening right-facing dragon
    with a long backward horn, a silver angry eye, an exposed fang, and a sharp
    silver-faceted batwing. Two steeply crossed medieval swords create a tall
    V-shaped crown and descend into visible crossguards, grips, and pommels.
    Black flame tendrils curl around the upper wing and lower sword ends. The
    letter counters and surrounding canvas remain transparent. Every part of
    the mark is an editable path, with no font dependency.
  </desc>

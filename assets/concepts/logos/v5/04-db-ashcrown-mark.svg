  <title id="db-ashcrown-title">Dragon Database — DB Ashcrown</title>
  <desc id="db-ashcrown-description">A compact black flame crest rises into a jagged crown around a threatening right-facing dragon. Swept horns, a heavy diagonal brow, a pale angry eye, and a silver fang frame original angular silver D and B letter paths. Silver flame facets reveal the wing geometry, and a short silver blade point finishes the lower crest. The surrounding canvas is transparent.</desc>
